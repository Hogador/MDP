name: Deploy Testnet

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip actual deploy)'
        type: boolean
        default: true

concurrency:
  group: deploy-testnet
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy contracts + backend
    runs-on: ubuntu-latest
    environment: testnet
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Forge build
        run: forge build --sizes
        working-directory: contracts

      # ── Deploy contracts ──
      - name: Deploy contracts (dry-run)
        if: ${{ inputs.dry_run }}
        run: forge script script/Deploy.s.sol --rpc-url bsc-testnet --account deployer --broadcast --verify --slow
        working-directory: contracts
        env:
          ETH_RPC_URL: ${{ vars.BSC_TESTNET_RPC }}
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          TREASURY_ADMIN: ${{ vars.TREASURY_ADMIN }}
          FINANCE_ROLE: ${{ vars.FINANCE_ROLE }}
          MDAOTOKEN_ADMIN: ${{ vars.MDAOTOKEN_ADMIN }}
          SOCIAL_RECOVERY_ADMIN: ${{ vars.SOCIAL_RECOVERY_ADMIN }}
          PAYMENT_SPLITTER_ADMIN: ${{ vars.PAYMENT_SPLITTER_ADMIN }}

      # ── Build backend ──
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Build backend
        run: ./gradlew assemble
        working-directory: backend

      # ── Deploy backend ──
      - name: Deploy backend
        if: ${{ !inputs.dry_run }}
        env:
          SSH_HOST: ${{ secrets.TESTNET_SSH_HOST }}
          SSH_USER: ${{ secrets.TESTNET_SSH_USER }}
          SSH_KEY: ${{ secrets.TESTNET_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          rsync -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            -avz backend/build/libs/ \
            $SSH_USER@$SSH_HOST:/opt/mdaopay/backend/
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            $SSH_USER@$SSH_HOST "sudo systemctl restart mdaopay-backend"

      - name: Summary
        run: |
          echo "## Deploy Testnet Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Dry run: ${{ inputs.dry_run }}" >> $GITHUB_STEP_SUMMARY
          echo "- Contracts: https://testnet.bscscan.com/address/..." >> $GITHUB_STEP_SUMMARY

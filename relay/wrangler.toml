name = "mdaopay-relay"
main = "src/index.ts"
compatibility_date = "2025-02-14"

# FCM credentials — set via:
#   wrangler secret put FCM_SERVER_KEY
# FCM_SERVER_KEY = ""

# Shared secret for HMAC request signing (required for write endpoints)
#   wrangler secret put RELAY_HMAC_SECRET
# RELAY_HMAC_SECRET = ""

[[kv_namespaces]]
binding = "KV"
id = ""
preview_id = ""

[env.testnet]
name = "mdaopay-relay-testnet"
kv_namespaces = [
  { binding = "KV", id = "", preview_id = "" }
]
# Set testnet-specific vars via: wrangler secret put --env testnet
#  RELAY_HMAC_SECRET, FCM_SERVER_KEY
